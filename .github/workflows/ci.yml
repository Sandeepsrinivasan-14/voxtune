name: CI
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install CPU-only torch first (no GPU on runners)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install the rest (GPU-only packages are imported lazily and skipped here)
        run: grep -vE '^(torch|bitsandbytes|nvidia-ml-py)$' requirements.txt > /tmp/req-ci.txt && pip install -r /tmp/req-ci.txt
      - name: Run tests
        run: |
          set +e
          python -m pytest -q --tb=short 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR)|^E  " pytest.log | head -8 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
          exit $rc

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
